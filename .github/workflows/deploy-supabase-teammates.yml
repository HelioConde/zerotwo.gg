name: Deploy ZeroTwo Supabase Function

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/public-lol-teammates/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-teammates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy public-lol-teammates
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: bieihhaobdztjyoweewa
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN is not configured; function deploy skipped."
          fi

      - name: Setup Supabase CLI
        if: steps.credentials.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy recurring teammates function
        if: steps.credentials.outputs.available == 'true'
        run: supabase functions deploy public-lol-teammates --project-ref "$SUPABASE_PROJECT_ID"
