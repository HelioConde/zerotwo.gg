name: Deploy ZeroTwo Public Riot Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/public-lol-teammates/**'
      - 'supabase/functions/public-lol-profile/**'
      - 'supabase/functions/privacy-manage/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-teammates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy public Riot profile and teammates
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: bieihhaobdztjyoweewa
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing. Add a Supabase Personal Access Token under repository Settings > Secrets and variables > Actions. No functions deployed."
            exit 1
          fi
          if [[ "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must start with sbp_. Project publishable/anon/service_role keys are NOT CLI access tokens. No functions deployed."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Deno for privacy unit tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run privacy account-erasure unit tests (no production data)
        run: deno test supabase/functions/privacy-manage/accountDeletion.test.ts

      - name: Ensure Riot Life and VALORANT ownership tables + private inbox exist
        shell: bash
        run: |
          set -euo pipefail
          for sqlfile in \
            supabase/migrations/20261001_riot_life_memory.sql \
            supabase/migrations/20260927_valorant_rso.sql \
            supabase/migrations/20261013210000_zerotwo_privacy_requests.sql \
            supabase/migrations/20261013212500_zerotwo_privacy_service_grants.sql; do
            jq -n --rawfile sql "$sqlfile" '{query:$sql,read_only:false}' > /tmp/zt-schema-query.json
            status=$(curl --silent --show-error --retry 2 --retry-delay 3 \
              --output /tmp/zt-schema-response.json --write-out '%{http_code}' \
              --request POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/zt-schema-query.json)
            if [[ "$status" != "201" ]]; then
              echo "::error::ZeroTwo schema $sqlfile failed (HTTP $status)."
              exit 1
            fi
            echo "ZeroTwo RLS schema installed from $sqlfile"
          done
          jq -n --arg sql "NOTIFY pgrst, 'reload schema';" '{query:$sql,read_only:false}' > /tmp/zt-schema-query.json
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/zt-schema-query.json)
          if [[ "$status" != "201" ]]; then echo "::error::PostgREST schema refresh failed"; exit 1; fi

      - name: Deploy public player profile
        run: supabase functions deploy public-lol-profile --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy recurring teammates function
        run: supabase functions deploy public-lol-teammates --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy authenticated privacy manager
        run: supabase functions deploy privacy-manage --project-ref "$SUPABASE_PROJECT_ID"
