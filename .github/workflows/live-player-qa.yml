name: ZeroTwo Live Account QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/live-player-qa.mjs'
      - '.github/workflows/live-player-qa.yml'

permissions:
  contents: read

concurrency:
  group: zerotwo-live-account-qa
  cancel-in-progress: true

jobs:
  smoke:
    name: AlchemyFlames BR1 (real Riot data)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and browser runner
        run: |
          npm install
          npm install --no-save playwright@1.56.0
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Validate frontend
        run: npm run typecheck
      - name: Test AlchemyFlames BR1 against actual Supabase
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/zerotwo-live-qa-vite.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          node scripts/live-player-qa.mjs
      - name: Upload sanitized results and viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerotwo-live-alchemyflames-qa
          path: live-qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
